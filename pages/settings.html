<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body class="settings-page">
    <section class="settings">
        <h3>Settings</h3>
        <img src="../public/assets/Line 3.svg" alt="Line">
    </section>
    <main>
        <section class="settings-left">
            <article class="settings-section">
                <div class="header-section">
                    <img src="../public/assets/palette.svg" alt="Game-Themes-Icon">
                    <h4>Game themes</h4>
                </div>
                <div class="main-section">
                    <p class="main-section__theme">
                        Code vibes theme
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                    <p class="main-section__theme">
                        DA Projects theme
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                </div>
            </article>

            <article class="settings-section">
                <div class="header-section">
                    <img src="../public/assets/chess_pawn.svg" alt="">
                    <h4>Choose player</h4>
                </div>
                 <div class="main-section">
                    <p class="main-section__player selectable">
                        Blue
                        <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                    </p>
                    <p class="main-section__player selectable">
                        Orange
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                </div>
            </article>

            <article class="settings-section">
                <div class="header-section">
                    <img src="../public/assets/style.svg" alt="">
                    <h4>Board size</h4>
                </div>
                <div class="main-section">
                    <p class="main-section__size selectable">
                        16 cards
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                    <p class="main-section__size selectable">
                        24 cards
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                    <p class="main-section__size selectable">
                        36 cards
                    <img src="../public/assets/Line 3 (1).svg" alt="Line-Image">
                </p>
                </div>
            </article>
        </section>
    </main>
</body>
<script type="module" src="../src/main.ts"></script>
</html>
