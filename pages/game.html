<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory-Game</title>
</head>
<body class="game-page">
    <header>
        <section class="header-left">
            <p class="header-left__first">Blue 0</p>
            <p class="header-left__second">Orange 0</p>
        </section>
        <section class="header-middle">
            <p>Current player:</p>
        </section>
        <section class="header-right">
            <button class="exit-button">
                <img src="../public/assets/move_item.svg" alt="Exit-Image">
                Exit game
            </button>
        </section>
        <div class="dialog hidden">
            <div class="dialog__content">
                <p>Are you sure you want to quit the game?</p>
                <div class="dialog__buttons">
                    <button class="dialog__no">No, back to game</button>
                    <button class="dialog__yes">Yes, quit game</button>
                </div>
            </div>
        </div>
    </header>
    <main class="game-board">
        <div class="card open">
            <div class="card__front"></div>
            <div class="card__back"></div>
        </div>
    </main>
    
</body>
<script type="module" src="../src/game.ts"></script>
</html>
